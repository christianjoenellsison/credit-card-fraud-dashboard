name: Check and deploy dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check static site files
        run: test -s site/index.html && test -s site/style.css
      - name: Upload site to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
